name: lint

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - "runner.py"
      - ".flake8"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "runner.py"
      - ".flake8"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

jobs:
  python:
    name: Python lint & format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify pyproject.toml exists
        run: test -f pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install black flake8 isort mypy
          fi

      # TODO: remove `continue-on-error: true` from the steps below once the
      # follow-up `style: format codebase with black/isort` PR lands.
      # See: docs/PROGRESS.md Sprint 1, follow-ups.

      - name: black --check
        run: black --check app/ scripts/ runner.py
        continue-on-error: true

      - name: isort --check
        run: isort --check-only app/ scripts/ runner.py
        continue-on-error: true

      - name: flake8
        run: flake8 app/ scripts/ runner.py
        continue-on-error: true

      - name: mypy
        run: mypy app/
        continue-on-error: true
